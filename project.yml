name: Bublr
options:
  bundleIdPrefix: com.nnnghia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Bublr:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Bublr
        PRODUCT_BUNDLE_IDENTIFIER: com.nnnghia.bublr
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      # A Debug build must not answer to the installed app's identity. xcodebuild registers every bundle it
      # produces with LaunchServices, so an identical bundle id means "Bublr" in Spotlight is a coin flip
      # between the installed release and whatever `.build/` produced last. The state file is keyed by path,
      # not bundle id, so both builds still share one workspace.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.nnnghia.bublr.dev
    dependencies:
      - sdk: WebKit.framework
      - sdk: Carbon.framework
    scheme:
      gatherCoverageData: false
      testTargets: []
