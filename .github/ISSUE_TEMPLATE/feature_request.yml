name: Feature request
description: Suggest a provider, a workflow or a UI improvement
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Bublr makes awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: Sketch the behaviour, not necessarily the implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Overlay / bubbles
        - Sign-in
        - A specific provider
        - Menu bar / shortcuts
        - Privacy / storage
        - Build / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: Bublr hosts providers' own web clients — it does not call unofficial APIs or store credentials.
      options:
        - label: This request can be built without scraping a provider API or storing credentials
          required: false
