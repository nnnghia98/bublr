name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & self-test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: make build CONFIG=Debug

      - name: Self-test
        run: make test

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: /tmp/bublr-selftest.json
          if-no-files-found: ignore
